<svg width="580" height="310" viewBox="0 0 580 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="20" y1="12" x2="560" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1114"/>
      <stop offset="1" stop-color="#17281D"/>
    </linearGradient>
    <linearGradient id="signal" x1="45" y1="0" x2="305" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BD9FF"/>
