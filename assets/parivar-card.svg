    <style>
      .flow { stroke-dasharray:7 9; animation:stream 4.6s linear infinite; }
      .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 3s ease-in-out infinite; }
      @keyframes stream { to { stroke-dashoffset:-64 } }
      @keyframes pulse { 0%,100% { opacity:.4; transform:scale(.9) } 50% { opacity:1; transform:scale(1.12) } }
      @media (prefers-reduced-motion: reduce) { .flow,.pulse { animation:none !important; } }
    </style>
  </defs>
  <rect width="580" height="310" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="578" height="308" rx="23" stroke="#A4DD72" stroke-opacity="0.22"/>
